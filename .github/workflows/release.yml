# Release on a tag vX.Y.Z: tests, static binaries for all targets, GitHub release with
# one archive per target (binary, LICENSE, THIRD-PARTY-NOTICES.md, README.md, README.de.md, web/)
# and SHA256SUMS. The tag must match `var version` in cmd/image-watermark/main.go.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Tag matches version in main.go
        run: |
          version=$(sed -n 's/^var version = "\(.*\)"/\1/p' cmd/image-watermark/main.go)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != main.go $version"; exit 1; }
      - name: Build and package
        run: |
          set -e
          v=${GITHUB_REF_NAME#v}
          mkdir -p out
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            name=image-watermark-$v-$os-$arch
            ext=; [ "$os" = windows ] && ext=.exe
            mkdir -p "pkg/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' \
              -o "pkg/$name/image-watermark$ext" ./cmd/image-watermark
            mkdir -p "pkg/$name/web" && cp web/index.html web/detect.php "pkg/$name/web/"
            cp LICENSE THIRD-PARTY-NOTICES.md README.md README.de.md "pkg/$name/"
            if [ "$os" = windows ]; then
              (cd pkg && zip -qr "../out/$name.zip" "$name")
            else
              tar -C pkg -czf "out/$name.tar.gz" "$name"
            fi
          done
          (cd out && sha256sum * > SHA256SUMS)
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
